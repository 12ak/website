        <!-- Lightbox -->
        <div id="lightbox" class="lightbox">
            <button class="lightbox-close" aria-label="Close">&times;</button>
            <button class="lightbox-prev" aria-label="Previous">&lsaquo;</button>
            <button class="lightbox-next" aria-label="Next">&rsaquo;</button>
            <img class="lightbox-image" src="" alt="">
        </div>

        <script>
        (function() {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox) return;
            
            const lightboxImg = lightbox.querySelector('.lightbox-image');
            const closeBtn = lightbox.querySelector('.lightbox-close');
            const prevBtn = lightbox.querySelector('.lightbox-prev');
            const nextBtn = lightbox.querySelector('.lightbox-next');
            let currentImages = [];
            let currentIndex = 0;

            function openLightbox(images, index) {
                currentImages = images;
                currentIndex = index;
                showImage();
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
                lightboxImg.src = '';
            }

            function showImage() {
                if (currentImages.length > 0 && currentImages[currentIndex]) {
                    lightboxImg.src = currentImages[currentIndex];
                }
                prevBtn.style.display = currentImages.length > 1 ? 'block' : 'none';
                nextBtn.style.display = currentImages.length > 1 ? 'block' : 'none';
            }

            function nextImage() {
                currentIndex = (currentIndex + 1) % currentImages.length;
                showImage();
            }

            function prevImage() {
                currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
                showImage();
            }

            // Event listeners
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a[data-lightbox]');
                if (link) {
                    e.preventDefault();
                    e.stopPropagation();
                    // Group by album if data-album is present
                    const album = link.getAttribute('data-album');
                    var allLinks;
                    if (album) {
                        allLinks = Array.from(document.querySelectorAll('a[data-lightbox][data-album="' + album + '"]'));
                    } else {
                        allLinks = Array.from(document.querySelectorAll('a[data-lightbox]'));
                    }
                    const images = allLinks.map(function(l) { return l.getAttribute('href'); });
                    const index = allLinks.indexOf(link);
                    openLightbox(images, index);
                }
            });

            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeLightbox();
            });
            
            prevBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                prevImage();
            });
            
            nextBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                nextImage();
            });

            lightbox.addEventListener('click', function(e) {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
            });

            // Auto-open lightbox if URL has #photo-{id} hash
            var hash = window.location.hash;
            if (hash && hash.startsWith('#photo-')) {
                var photoId = hash.substring(7);
                var targetLink = document.querySelector('a[data-lightbox][data-photo-id="' + photoId + '"]');
                if (targetLink) {
                    var allLinks = Array.from(document.querySelectorAll('a[data-lightbox]'));
                    var images = allLinks.map(function(l) { return l.getAttribute('href'); });
                    var index = allLinks.indexOf(targetLink);
                    if (index >= 0) {
                        openLightbox(images, index);
                    }
                }
            }
        })();
        </script>

        <!-- Google Analytics - deferred loading for better performance -->
        <script>
        (function() {
            // Load GA after page interaction or after 3 seconds, whichever comes first
            var loaded = false;
            function loadGA() {
                if (loaded) return;
                loaded = true;
                var script = document.createElement('script');
                script.src = 'https://www.googletagmanager.com/gtag/js?id=G-47GTWN9S5M';
                script.async = true;
                document.head.appendChild(script);
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                window.gtag = gtag;
                gtag('js', new Date());
                gtag('config', 'G-47GTWN9S5M');
            }
            // Load on first interaction
            ['scroll', 'click', 'touchstart', 'keydown'].forEach(function(event) {
                document.addEventListener(event, loadGA, {once: true, passive: true});
            });
            // Or after 3 seconds if no interaction
            setTimeout(loadGA, 3000);
        })();
        </script>
